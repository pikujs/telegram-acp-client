[project]
name = "telegram-acp-client"
version = "0.1.0"
description = "Telegram bot to communicate with agents via ACP (Agent Client Protocol)"
readme = "README.md"
authors = [
    { name = "pikujs" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "agent-client-protocol>=0.8.1",
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "python-telegram-bot[callback-data]>=22.6",
]

[project.scripts]
telegram-acp-client = "telegram_acp_client.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
